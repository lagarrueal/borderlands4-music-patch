<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borderlands Music Picker</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #c2410c; --accent-ink: #ffffff; --row-hover: #f1efe9; --playing: #fff4e8;
  --combat: #b42318; --boss: #7a2e98; --explore: #1f6f8b; --other: #6b6a66;
  --star: #d99a00; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a998f; --line: #2e2d2a;
    --accent: #f97316; --accent-ink: #141413; --row-hover: #24231f; --playing: #2b2016;
    --combat: #f0857a; --boss: #c99be0; --explore: #6cc2dd; --other: #9a998f;
    --star: #f5c542; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a998f; --line: #2e2d2a;
  --accent: #f97316; --accent-ink: #141413; --row-hover: #24231f; --playing: #2b2016;
  --combat: #f0857a; --boss: #c99be0; --explore: #6cc2dd; --other: #9a998f;
  --star: #f5c542; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0; }
.controls { position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); }
.controls-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex;
  flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
input[type="search"] { flex: 1 1 200px; min-width: 0; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 140px; }
.shortlist { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; margin: 12px 0 20px; box-shadow: var(--shadow); }
.shortlist h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.shortlist .actions { margin-left: auto; display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
  padding: 5px 10px; cursor: pointer; font: inherit; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.empty { color: var(--muted); margin: 0; }
h2.game { font-size: 17px; margin: 26px 0 6px; }
details.area { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  margin: 8px 0; overflow: hidden; }
details.area > summary { cursor: pointer; padding: 9px 12px; font-weight: 600; list-style: none;
  display: flex; gap: 8px; align-items: center; }
details.area > summary::-webkit-details-marker { display: none; }
details.area > summary::before { content: "\25B8"; color: var(--muted); transition: transform .15s; }
details.area[open] > summary::before { transform: rotate(90deg); }
.count { color: var(--muted); font-weight: 400; font-size: 13px; }
.row { display: grid; grid-template-columns: 34px 1fr auto 34px; gap: 10px; align-items: center;
  padding: 7px 12px; border-top: 1px solid var(--line); }
.row:hover { background: var(--row-hover); }
.row.playing { background: var(--playing); }
.play { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; font-size: 12px; }
.row.playing .play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.title { min-width: 0; }
.title .label { font-weight: 600; }
.title .detail { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .04em; margin-right: 6px; }
.badge.combat { color: var(--combat); } .badge.boss { color: var(--boss); }
.badge.explore { color: var(--explore); } .badge.other { color: var(--other); }
.dur { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.star { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--muted);
  line-height: 1; }
.star[aria-pressed="true"] { color: var(--star); }
.note { grid-column: 2 / 5; }
.note input { width: 100%; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
.pick { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 5px 0;
  border-top: 1px solid var(--line); }
.pick:first-of-type { border-top: none; }
.pick .meta { color: var(--muted); font-size: 12px; }
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel);
  border-top: 1px solid var(--line); box-shadow: var(--shadow); }
.player-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: grid;
  grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.now { min-width: 0; }
.now .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now .a { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
audio { width: 100%; }
.keys { color: var(--muted); font-size: 12px; }
.modpanel { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: 12px; padding: 12px 14px; margin: 12px 0 8px; box-shadow: var(--shadow); }
.modpanel h2 { font-size: 15px; margin: 0 0 2px; }
.modpanel .sub { margin-bottom: 10px; font-size: 13px; }
.change { display: grid; grid-template-columns: minmax(140px, 1.1fr) minmax(180px, 1.6fr) auto; gap: 10px;
  align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.change .slot { font-weight: 600; }
.change .state, .change .src .meta { color: var(--muted); font-size: 12px; }
.change .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn.after { border-color: var(--accent); color: var(--accent); }
.modnotes { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.modnotes li { margin: 3px 0; }
.badge.changed { color: var(--accent); }
.replaced { font-size: 12px; color: var(--accent); }
.row .after { margin-left: 8px; padding: 1px 8px; font-size: 12px; }
@media (max-width: 640px) {
  .player-inner { grid-template-columns: 1fr; }
  .keys { display: none; }
  .change { grid-template-columns: 1fr; }
  .change .btns { justify-content: flex-start; }
}
</style>
</head>
<body>
<header>
  <h1>Borderlands Music Picker</h1>
  <p class="sub" id="summary">Loading tracks...</p>
</header>

<div class="controls"><div class="controls-inner" id="controls"></div></div>

<main>
  <section class="modpanel" id="modpanel" hidden></section>
  <section class="shortlist" id="shortlist"></section>
  <div id="list"></div>
</main>

<div class="player">
  <div class="player-inner">
    <div style="display:flex;gap:6px">
      <button class="btn" id="prev" title="Previous (P)">&#9664;&#9664;</button>
      <button class="btn" id="next" title="Next (N)">&#9654;&#9654;</button>
    </div>
    <div class="now"><div class="t" id="nowTitle">Nothing playing</div>
      <div class="a" id="nowArea">Pick a track. Space plays or pauses, N and P skip, S stars.</div>
      <audio id="audio" controls preload="none"></audio></div>
    <div class="keys">Space &middot; N &middot; P &middot; S</div>
  </div>
</div>

<script src="tracks.js"></script>
<script src="mod.js"></script>
<script>
(function () {
  const TRACKS = (window.TRACKS || []).filter(t => t.file);
  const MOD = window.MOD || null;
  const CHANGED = {};          // BL4 track id -> the change that replaced it
  if (MOD) MOD.changes.forEach(c => c.bl4.forEach(id => { CHANGED[id] = c; }));
  const KIND_ORDER = { combat: 0, boss: 1, explore: 2, other: 3 };
  const KIND_NAME = { combat: "Combat", boss: "Boss", explore: "Exploration", other: "Other" };
  const GAMES = ["BL2", "BL3", "BL4"];
  const GAME_NAME = { BL2: "Borderlands 2", BL3: "Borderlands 3", BL4: "Borderlands 4 (current music)" };
  const STORE = "blmusic.picks.v1";

  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(picks)); } catch (e) {} }
  let picks = load();

  const state = { games: new Set(["BL2", "BL3"]), kinds: new Set(["combat", "boss"]), q: "", onlyPicks: false, onlyChanged: false };
  const BY_ID = {};
  TRACKS.forEach(t => { BY_ID[t.id] = t; });
  const srcLabel = id => { const s = BY_ID[id]; return s ? s.game + " · " + s.area + " · " + s.label : id; };
  // a mod change's "after" render, playable like any library track
  const afterTrack = c => ({ id: "after:" + c.after, game: "BL4 + mod", area: c.slot, kind: "combat",
    label: c.state, detail: "In game with the mod: " + srcLabel(c.source), file: c.after, dur: c.after_dur });
  const audio = document.getElementById("audio");
  let visible = [], current = null;

  const fmt = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function chip(text, pressed, onclick) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = text; b.setAttribute("aria-pressed", pressed);
    b.onclick = onclick; return b;
  }

  function renderControls() {
    const c = document.getElementById("controls"); c.innerHTML = "";
    GAMES.forEach(g => c.appendChild(chip(g, state.games.has(g), () => {
      state.games.has(g) ? state.games.delete(g) : state.games.add(g); renderAll(); })));
    const s1 = document.createElement("span"); s1.className = "sep"; c.appendChild(s1);
    Object.keys(KIND_NAME).forEach(k => c.appendChild(chip(KIND_NAME[k], state.kinds.has(k), () => {
      state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k); renderAll(); })));
    const s2 = document.createElement("span"); s2.className = "sep"; c.appendChild(s2);
    c.appendChild(chip("★ Shortlist only", state.onlyPicks, () => { state.onlyPicks = !state.onlyPicks; renderAll(); }));
    if (MOD) c.appendChild(chip("Changed by mod", state.onlyChanged, () => { state.onlyChanged = !state.onlyChanged; renderAll(); }));
    const q = document.createElement("input"); q.type = "search"; q.placeholder = "Search area or name";
    q.value = state.q; q.oninput = () => { state.q = q.value.toLowerCase(); renderList(); };
    c.appendChild(q);
  }

  function matches(t) {
    if (state.onlyChanged) return !!CHANGED[t.id] &&
      (!state.q || (t.area + " " + t.label).toLowerCase().includes(state.q));
    if (!state.games.has(t.game) || !state.kinds.has(t.kind)) return false;
    if (state.onlyPicks && !picks[t.id]) return false;
    if (state.q && !(t.area + " " + t.label + " " + t.detail + " " + t.game).toLowerCase().includes(state.q)) return false;
    return true;
  }

  function renderList() {
    const list = document.getElementById("list"); list.innerHTML = "";
    visible = TRACKS.filter(matches).sort((a, b) =>
      GAMES.indexOf(a.game) - GAMES.indexOf(b.game) || a.area.localeCompare(b.area) ||
      KIND_ORDER[a.kind] - KIND_ORDER[b.kind] || a.label.localeCompare(b.label));
    let lastGame = null, areaBox = null, lastArea = null;
    visible.forEach(t => {
      if (t.game !== lastGame) {
        const h = document.createElement("h2"); h.className = "game"; h.textContent = GAME_NAME[t.game];
        list.appendChild(h); lastGame = t.game; lastArea = null;
      }
      if (t.area !== lastArea) {
        areaBox = document.createElement("details"); areaBox.className = "area";
        areaBox.open = state.q !== "" || state.onlyPicks || visible.length < 60;
        const n = visible.filter(x => x.game === t.game && x.area === t.area).length;
        areaBox.innerHTML = "<summary>" + esc(t.area) + ' <span class="count">' + n + "</span></summary>";
        list.appendChild(areaBox); lastArea = t.area;
      }
      areaBox.appendChild(row(t));
    });
    if (!visible.length) list.innerHTML = '<p class="empty">No tracks match these filters.</p>';
    document.getElementById("summary").textContent = TRACKS.length + " tracks, " +
      Math.round(TRACKS.reduce((s, t) => s + (t.dur || 0), 0) / 360) / 10 + " hours. Showing " + visible.length + ".";
  }

  function row(t) {
    const r = document.createElement("div"); r.className = "row" + (current && current.id === t.id ? " playing" : "");
    r.dataset.id = t.id;
    r.innerHTML = '<button class="play" title="Play">▶</button>' +
      '<div class="title"><div><span class="badge ' + t.kind + '">' + KIND_NAME[t.kind] + "</span>" +
      '<span class="label">' + esc(t.label) + "</span></div>" +
      '<div class="detail">' + esc(t.detail || "") + "</div></div>" +
      '<span class="dur">' + fmt(t.dur) + "</span>" +
      '<button class="star" title="Shortlist (S)" aria-pressed="' + (!!picks[t.id]) + '">★</button>';
    r.querySelector(".play").onclick = () => play(t);
    r.querySelector(".star").onclick = () => toggle(t);
    const c = CHANGED[t.id];
    if (c) {
      r.querySelector(".badge").insertAdjacentHTML("beforebegin", '<span class="badge changed">Changed</span>');
      const line = document.createElement("div"); line.className = "replaced";
      line.innerHTML = "Now plays: " + esc(srcLabel(c.source)) +
        ' <button class="btn after" title="Hear it as the mod plays it">▶ after</button>';
      line.querySelector("button").onclick = () => play(afterTrack(c));
      r.querySelector(".title").appendChild(line);
    }
    if (picks[t.id]) {
      const n = document.createElement("div"); n.className = "note";
      n.innerHTML = '<input placeholder="Note, e.g. use for Fadefields combat" value="' + esc(picks[t.id].note || "") + '">';
      n.querySelector("input").oninput = e => { picks[t.id].note = e.target.value; save(); renderShortlist(); };
      r.appendChild(n);
    }
    return r;
  }

  function toggle(t) {
    if (picks[t.id]) delete picks[t.id]; else picks[t.id] = { note: "", added: Date.now() };
    save(); renderList(); renderShortlist();
  }

  function play(t) {
    if (current && current.id === t.id) { audio.paused ? audio.play() : audio.pause(); return; }
    current = t; audio.src = t.file; audio.play();
    document.getElementById("nowTitle").textContent = t.game + " · " + t.area + " · " + t.label;
    document.getElementById("nowArea").textContent = (t.detail || "") + " · " + fmt(t.dur);
    document.querySelectorAll(".row.playing").forEach(e => e.classList.remove("playing"));
    const el = document.querySelector('.row[data-id="' + CSS.escape(t.id) + '"]');
    if (el) { el.classList.add("playing"); const d = el.closest("details"); if (d) d.open = true; }
  }

  function step(dir) {
    if (!visible.length) return;
    const i = current ? visible.findIndex(t => t.id === current.id) : -1;
    play(visible[(i + dir + visible.length) % visible.length]);
  }

  function shortlistText() {
    const ids = Object.keys(picks).sort((a, b) => (picks[a].added || 0) - (picks[b].added || 0));
    return ids.map(id => {
      const t = TRACKS.find(x => x.id === id);
      return t ? "- " + t.game + " | " + t.area + " | " + t.label + " | " + id + (picks[id].note ? " | " + picks[id].note : "") : "- " + id;
    }).join("\n");
  }

  function renderShortlist() {
    const box = document.getElementById("shortlist");
    const ids = Object.keys(picks);
    box.innerHTML = '<h2>★ Shortlist <span class="count">' + ids.length + "</span>" +
      '<span class="actions"><button class="btn primary" id="copy">Copy for Claude</button>' +
      '<button class="btn" id="clear">Clear</button></span></h2>';
    if (!ids.length) {
      box.insertAdjacentHTML("beforeend", '<p class="empty">Star tracks you like. Add a note to say where each should go, then copy the list into the chat.</p>');
    } else {
      ids.sort((a, b) => (picks[a].added || 0) - (picks[b].added || 0)).forEach(id => {
        const t = TRACKS.find(x => x.id === id); if (!t) return;
        const d = document.createElement("div"); d.className = "pick";
        d.innerHTML = '<div><div><span class="badge ' + t.kind + '">' + KIND_NAME[t.kind] + "</span>" +
          esc(t.game + " · " + t.area + " · " + t.label) + '</div><div class="meta">' +
          esc(picks[id].note || "no note") + '</div></div><button class="btn">▶</button>';
        d.querySelector("button").onclick = () => play(t);
        box.appendChild(d);
      });
    }
    box.querySelector("#copy").onclick = async e => {
      const text = "My music shortlist:\n" + shortlistText();
      try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied"; }
      catch (err) { window.prompt("Copy this:", text); }
      setTimeout(() => { e.target.textContent = "Copy for Claude"; }, 1500);
    };
    box.querySelector("#clear").onclick = () => {
      if (ids.length && confirm("Clear the whole shortlist?")) { picks = {}; save(); renderAll(); }
    };
  }

  function renderModPanel() {
    const box = document.getElementById("modpanel");
    if (!MOD) return;
    box.hidden = false;
    box.innerHTML = "<h2>What the mod changes in BL4</h2>" +
      '<p class="sub">' + esc(MOD.name) + ", built " + esc(MOD.built) +
      ". Before is BL4's own music; After is the patched game rendered offline; Source is the original track.</p>";
    MOD.changes.forEach(c => {
      const d = document.createElement("div"); d.className = "change";
      const before = c.bl4.map(id => BY_ID[id]).filter(Boolean);
      d.innerHTML = '<div><div class="slot">' + esc(c.slot) + '</div><div class="state">' + esc(c.state) + "</div></div>" +
        '<div class="src"><div>' + esc(srcLabel(c.source)) + '</div><div class="meta">loops every ' +
        fmt(c.loop_s) + ", level " + c.lufs + " LUFS (BL4's was " + c.orig_lufs + ")</div></div>" +
        '<div class="btns"><button class="btn" data-b>▶ Before</button>' +
        '<button class="btn after" data-a>▶ After</button><button class="btn" data-s>▶ Source</button></div>';
      const bb = d.querySelector("[data-b]");
      if (before.length) bb.onclick = () => play(before[0]); else bb.disabled = true;
      if (before.length > 1) bb.title = before.length + " zones: this plays the first, use \"Changed by mod\" to see all";
      d.querySelector("[data-a]").onclick = () => play(afterTrack(c));
      const src = BY_ID[c.source];
      const sb = d.querySelector("[data-s]");
      if (src) sb.onclick = () => play(src); else sb.disabled = true;
      box.appendChild(d);
    });
    if (MOD.notes && MOD.notes.length)
      box.insertAdjacentHTML("beforeend", '<ul class="modnotes">' +
        MOD.notes.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul>");
  }

  function renderAll() { renderControls(); renderList(); renderShortlist(); }

  audio.addEventListener("ended", () => step(1));
  document.getElementById("next").onclick = () => step(1);
  document.getElementById("prev").onclick = () => step(-1);
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); if (current) { audio.paused ? audio.play() : audio.pause(); } else step(1); }
    else if (e.key === "n" || e.key === "N") step(1);
    else if (e.key === "p" || e.key === "P") step(-1);
    else if ((e.key === "s" || e.key === "S") && current) toggle(current);
  });

  window.blmusic = { shortlistText, picks: () => picks };
  renderModPanel();
  renderAll();
})();
</script>
</body>
</html>
