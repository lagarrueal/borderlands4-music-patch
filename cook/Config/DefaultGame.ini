[/Script/UnrealEd.ProjectPackagingSettings]
; The cooker only processes assets reachable from the maps in the cook list.
; ProbeTone is referenced by nothing, so without this it is silently skipped -
; the first cook "succeeded" and produced only engine fonts.
+DirectoriesToAlwaysCook=(Path="/Game/ProbeAudio")

; NOTE: bUseUnversionedPropertySerialization does NOT exist in UE 5.8. The real
; control is CanUseUnversionedPropertySerialization under [Core.System], and
; setting it False crashes the cooker outright. Recorded so it is not retried.
bShareMaterialShaderCode=False
UsePakFile=True
